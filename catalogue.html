.tracking{max-width:520px;margin:24px auto;padding:20px;background:#fff;border:1px solid #dfe6ee;border-radius:14px;color:#18283c;overflow-wrap:anywhere}
.tracking h2{margin:4px 0}.tracking p{margin:8px 0}.tracking ul{padding-left:20px}.tracking li{margin:8px 0}
.tracking .tl{list-style:none;margin:16px 0 8px;padding:0}.tracking .tl li{position:relative;margin:0;padding:0 0 18px 34px;min-height:26px}
.tracking .tl li::before{content:"";position:absolute;left:10px;top:22px;bottom:-4px;width:2px;background:#cfd8e3}.tracking .tl li:last-child{padding-bottom:0}.tracking .tl li:last-child::before{display:none}
.tracking .tl li.done::before{background:#1F3864}
.tracking .tl .dot{position:absolute;left:0;top:1px;width:22px;height:22px;border-radius:50%;border:2px solid #cfd8e3;background:#fff;box-sizing:border-box;display:grid;place-items:center;font-size:12px;line-height:1;color:#fff}
.tracking .tl li.done .dot{background:#1F3864;border-color:#1F3864}.tracking .tl li.done .dot::after{content:"✓"}
.tracking .tl li.current .dot,.tracking .tl li.partial .dot{border-color:#1F3864;box-shadow:0 0 0 4px rgba(31,56,100,.15)}.tracking .tl li.partial .dot{background:linear-gradient(90deg,#1F3864 50%,#fff 50%)}
.tracking .tl li.stopped .dot{background:#b3261e;border-color:#b3261e}.tracking .tl li.stopped .dot::after{content:"✕"}
.tracking .tl li.upcoming{color:#6b7a8d}.tracking .tl .tt{font-weight:700;display:block}.tracking .tl .ts{display:block;font-size:.9em;color:#4a5b70}.tracking .tl li.upcoming .ts{color:#7d8b9d}

.inst-wrap{position:fixed;inset:0;z-index:99999;display:flex;align-items:flex-end;justify-content:center}
.inst-back{position:absolute;inset:0;background:rgba(15,25,45,.5)}
.inst{position:relative;width:100%;max-width:520px;background:#fff;color:#18283c;border-radius:22px 22px 0 0;padding:10px 20px calc(18px + env(safe-area-inset-bottom));box-shadow:0 -10px 40px rgba(0,0,0,.25);animation:instup .28s ease-out;outline:0;max-height:92vh;overflow:auto}

@media (prefers-reduced-motion:reduce){.inst{animation:none}}
@media (min-width:640px){.inst-wrap{align-items:center}.inst{border-radius:22px;padding-bottom:20px}}
.inst-grab{display:block;width:44px;height:5px;border-radius:3px;background:#d5dce6;margin:0 auto 14px}
.inst-head{display:flex;gap:14px;align-items:center}.inst-head img{width:64px;height:64px;border-radius:16px;flex:none}
.inst-head h2{margin:0;font-size:1.25rem;color:var(--navy,#1F3864)}.inst-head p{margin:2px 0 0;color:#5a6b80;font-size:.95rem;overflow-wrap:anywhere}
.inst-feats{list-style:none;margin:16px 0;padding:0;display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.inst-feats li{background:#f4f7fb;border-radius:14px;padding:12px 6px;text-align:center;font-size:.88rem;font-weight:600;line-height:1.25}
.inst-feats svg{display:block;margin:0 auto 8px;width:40px;height:40px;padding:9px;box-sizing:border-box;border-radius:50%;background:#e3ebf6;color:var(--navy,#1F3864)}
.inst-steps{margin:0 0 14px;padding:12px 14px 12px 34px;background:#f4f7fb;border-radius:14px;line-height:1.5;font-size:.95rem}
.inst-steps svg{width:18px;height:18px;vertical-align:-3px;color:var(--navy,#1F3864)}
.inst button{font:inherit;cursor:pointer;display:block;width:100%;min-height:48px;border-radius:14px;border:0}
.inst .inst-go{background:var(--navy,#1F3864);color:#fff;font-weight:700;font-size:1.05rem;display:flex;align-items:center;justify-content:center;gap:8px}
.inst .inst-later{background:none;color:#4a5b70;font-weight:600;margin-top:6px}.inst .inst-never{background:none;color:#7a8898;font-size:.88rem;min-height:44px}
.inst button:focus-visible{outline:3px solid #c9a227;outline-offset:2px}
